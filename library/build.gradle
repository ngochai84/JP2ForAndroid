apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    namespace 'com.gemalto.jp2'
    compileSdkVersion 36
    defaultConfig {
        minSdkVersion 24
        versionName "1.0.3"
        versionCode 4
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
    ndkVersion '27.3.13750724'
    compileOptions {
        targetCompatibility JavaVersion.VERSION_17
        sourceCompatibility JavaVersion.VERSION_17
    }
    buildToolsVersion '36.0.0'
//    kotlinOptions {
//        jvmTarget = JavaVersion.VERSION_17.toString()
//        apiVersion = '1.1'
//        languageVersion = '1.1'
//    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
//    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.10" // Or a newer compatible version
    implementation 'androidx.annotation:annotation:1.9.1'
    //testImplementation 'junit:junit:4.13.1'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

/*************************************************************/
/******************* PUBLISHING STUFF ************************/
/*************************************************************/
//create a sources jar
tasks.register('sourceJar', Jar) {
    from android.sourceSets.main.java.srcDirs
//    classifier 'sources'
}

//publish to a local Maven repository with the sources jar and all dependencies
publishing {
    publications {
        aarRelease(MavenPublication) {
            groupId 'com.gemalto.jp2'
            artifactId 'jp2-android'
            version "${android.defaultConfig.versionName}"
            
            // Add the AAR artifact - let Gradle handle the dependency automatically
            artifact("$buildDir/outputs/aar/${project.name}-release.aar")
            
            // Add the sources jar
            artifact(sourceJar)
            
            // Add the POM with dependencies
            pom.withXml {
                def dependenciesNode = asNode().appendNode('dependencies')
                configurations.implementation.allDependencies.each {
                    if (it.group != null && it.name != null && it.version != null) {
                        def dependencyNode = dependenciesNode.appendNode('dependency')
                        dependencyNode.appendNode('groupId', it.group)
                        dependencyNode.appendNode('artifactId', it.name)
                        dependencyNode.appendNode('version', it.version)
                        dependencyNode.appendNode('scope', 'implementation')
                    }
                }
            }
        }
    }
    repositories {
        maven {
            url 'build/repo'
        }
    }
}

// Ensure the publishing task depends on the AAR bundle task
afterEvaluate {
    tasks.named('publishAarReleasePublicationToMavenLocal').configure {
        dependsOn 'bundleReleaseAar'
    }
}
